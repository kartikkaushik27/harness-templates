template:
  name: docker build push
  identifier: docker_build_push
  type: Step
  orgIdentifier: CUSTOMER
  tags:
    version: 2.0.0
    team: platform
    status: in-review
  spec:
    type: BuildAndPushDockerRegistry
    spec:
      connectorRef: <+input>
      repo: <+input>
      tags:
        - <+pipeline.sequenceId>
        - latest:1
      dockerfile: <+input>.default(Dockerfile)
      context: <+input>.default(.)
      buildArgs: <+input>.optional()
    timeout: 20m
  versionLabel: 3.0.0
