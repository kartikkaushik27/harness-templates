template:
  name: Docker Build and Push
  identifier: docker_build_push
  versionLabel: "2.0.0"
  type: Step
  tags:
    version: "2.0.0"
    team: platform
    breaking-change: "false"
  spec:
    type: BuildAndPushDockerRegistry
    spec:
      connectorRef: <+input>
      repo: <+input>
      tags:
        - <+pipeline.sequenceId>
        - latest
      dockerfile: <+input>.default(Dockerfile)
      context: <+input>.default(.)
      buildArgs: <+input>.optional()
    timeout: 20m
